spring:
  application:
    name: nearby-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:nearby}}
    username: ${DB_USERNAME:${POSTGRES_USER:nearby}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:nearby}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      enabled: false

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
      completion-mode: update

  docker:
    compose:
      lifecycle-management: start-only

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-secret-change-me-please-32b+}
      issuer: ${JWT_ISSUER:nearby-backend}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${app.storage.endpoint}}
    access-key: ${MINIO_ACCESS_KEY:nearby}
    secret-key: ${MINIO_SECRET_KEY:nearby-secret}
    bucket: ${MINIO_BUCKET:nearby-images}
    region: ${MINIO_REGION:us-east-1}
    presign-ttl: ${MINIO_PRESIGN_TTL:10m}
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:24h}

logging:
  level:
    vn.edu.uit.nearby: INFO
